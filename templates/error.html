<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>خطا!</title>
     <style> /* استایل‌های دارک و نئونی مشابه بالا */
        body { background: linear-gradient(135deg, #800020, #6a0dad, #24243e); color: #e0e0e0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); background-color: rgba(36, 36, 62, 0.8); padding: 40px; width: 380px; backdrop-filter: blur(5px); border: none; }
        .card h3 { color: #ff69b4; text-shadow: 0 0 10px #ff69b4; margin-bottom: 30px; }
        .btn-warning { background-color: #ff69b4; border-color: #ff69b4; border-radius: 10px; padding: 12px; font-weight: bold; transition: all 0.3s ease; }
        .btn-warning:hover { background-color: #ff1493; border-color: #ff1493; box-shadow: 0 0 15px #ff1493; }
    </style>
</head>
<body>
    <div class="card text-center">
        <h3 class="mb-4">اوه اوه! یه مشکلی پیش اومده! 😥</h3>
        <p>{{ message }}</p>
        <a href="/" class="btn btn-warning w-100 mt-4">برگشت به صفحه اول</a>
    </div>
</body>
</html>
